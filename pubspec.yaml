name: nexdesk_mobile
description: "NexDesk for support teams on the go."
publish_to: 'none'

# versionName+versionCode. The build number is what /api/v1/mobile/config compares against.
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  cupertino_ui: ^1.1.7
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  file_picker: ^13.4.0
  flutter_image_compress: ^2.5.1
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  signalr_netcore: ^1.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  swagger_parser: ^2.3.0
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  generate: true
  uses-material-design: true
