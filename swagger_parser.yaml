# Generates the typed API client from the committed OpenAPI snapshot: plain Dart models and a Dio client, so it
# needs no code generation step of its own. Run scripts/update-api.sh to refresh the snapshot from a running
# API; never edit lib/core/api/generated by hand.
swagger_parser:
  schema_path: openapi/nexdesk-v1.json
  output_directory: lib/core/api/generated
  generation:
    root_api_class_name: NexDeskApi
    http_client: dio
    serializer: plain
    unknown_enum_values: preserve
    delimited_query_array_explode: repeat
    generate_docs: false
    page_width: 100
