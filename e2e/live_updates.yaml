# Maya has a ticket open when Daniel adds a note mentioning her: the note appears on her screen without a refresh,
# a banner says she was mentioned, and the Notifications badge goes up.
appId: app.nexdesk.mobile.dev
env:
  PASSWORD: "NexDesk-demo-2026"
---
- runScript: scripts/mention_token.js
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in to your workspace"
    timeout: 60000
- tapOn: "Email"
- inputText: "maya@brightpath.demo"
- tapOn: "Password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "(?s)#\\d+  .*"
    timeout: 30000
- tapOn:
    text: "(?s)#\\d+  .*"
    index: 0
- extendedWaitUntil:
    visible: "Reply to .*"
    timeout: 20000
- copyTextFrom: "#\\d+"
- runScript:
    file: scripts/daniel_mentions_maya.js
    env:
      PASSWORD: ${PASSWORD}
      NUMBER: ${maestro.copiedText}
- assertTrue: ${output.noteSent}
- extendedWaitUntil:
    visible: "Daniel Reyes mentioned you on ticket ${maestro.copiedText}"
    timeout: 10000
# She is reading from the top, so the view stays put; scrolling down shows the note (scrolling does not reload).
- scrollUntilVisible:
    element: "(?s).*@Maya Chen live check ${output.mention}.*"
    direction: DOWN
    # The demo ticket's timeline grows with every run of the other flows.
    timeout: 90000
    speed: 80
    visibilityPercentage: 50
- assertVisible: "Notifications, \\d+ unread.*"
- takeScreenshot: build/e2e/live-updates
