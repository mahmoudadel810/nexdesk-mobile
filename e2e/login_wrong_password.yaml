# A wrong password shows the API's reason and stays on the sign-in screen.
appId: app.nexdesk.mobile.dev
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in to your workspace"
    timeout: 60000
- tapOn: "Email"
- inputText: "maya@brightpath.demo"
- tapOn: "Password"
- inputText: "not-the-password"
- hideKeyboard
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "The email or password is incorrect."
    timeout: 30000
- assertVisible: "Sign in to your workspace"
