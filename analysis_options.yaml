include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 110

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    # Generated code: the API client, localizations and drift tables.
    - lib/core/api/generated/**
    - lib/core/l10n/generated/**
    - "**/*.g.dart"
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - cancel_subscriptions
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
